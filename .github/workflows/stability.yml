name: Nightly Stability

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Number of stability prompts to run
        required: false
        default: "5"
      tier:
        description: Optional tier filter (Easy, Medium, Hard)
        required: false
        default: ""

jobs:
  stability:
    runs-on: ubuntu-latest
    if: ${{ secrets.GROQ_API_KEY != '' }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stability suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || '5' }} --out stability-results.json"
          if [ -n "${{ github.event.inputs.tier }}" ]; then
            ARGS="$ARGS --tier ${{ github.event.inputs.tier }}"
          fi
          python test_stability.py $ARGS

      - name: Upload stability results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-results
          path: stability-results.json
          if-no-files-found: ignore
